name: jobtracker-integration

services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: jobtracker_test
      POSTGRES_USER: jobtracker_test
      POSTGRES_PASSWORD: jobtracker_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker_test -d jobtracker_test"]
      interval: 2s
      timeout: 2s
      retries: 20
